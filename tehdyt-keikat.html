<!DOCTYPE html>
<html lang="fi">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tehdyt keikat – Kureliivit ja jaloimmat reidet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
    />
  <link rel="stylesheet" href="style.css">
</head>
  
  <body>
    
<header>
  <nav class="container site-nav" aria-label="Päänavigaatio">
    <a href="index.html#hero"
       class="site-logo-link"
       aria-label="Takaisin etusivulle">
      <img
        src="kureliivit header-logo.PNG"
        alt="Kureliivit-header-logo"
        class="site-logo"
      >
    </a>
    
<button
  class="menu-toggle"
  aria-expanded="false"
  aria-controls="nav-menu"
  aria-label="Avaa navigaatiovalikko"
>
  <span class="menu-icon">☰</span>
</button>

<ul class="nav-links" role="menubar" id="nav-menu">
  <li><a href="index.html#esitykset" role="menuitem">Ajankohtaista</a></li>
  <li><a href="#menneet-keikat" role="menuitem">Tehdyt keikat</a></li>
  <li><a href="index.html#yhteystiedot" role="menuitem">Yhteystiedot</a></li>
</ul>

  </nav>
</header>

  <main>
    <section class="section" id="menneet-keikat">
      <div class="container">
        <h1 class="section-title">Tehdyt keikat</h1>
      </div>
    </section>
  </main>
    
<script>
  const menuToggle = document.querySelector(".menu-toggle");
  const navLinks = document.querySelector(".nav-links");
  const menuIcon = document.querySelector(".menu-icon");

  function closeMenu() {
    navLinks.classList.remove("active");
    menuToggle.setAttribute("aria-expanded", "false");
    menuToggle.setAttribute("aria-label", "Avaa navigaatiovalikko");
    menuIcon.textContent = "☰";
  }

  menuToggle.addEventListener("click", () => {
    const isActive = navLinks.classList.toggle("active");

    menuToggle.setAttribute("aria-expanded", String(isActive));
    menuToggle.setAttribute(
      "aria-label",
      isActive ? "Sulje navigaatiovalikko" : "Avaa navigaatiovalikko"
    );
    menuIcon.textContent = isActive ? "✕" : "☰";
  });

  navLinks.querySelectorAll("a").forEach((link) => {
    link.addEventListener("click", closeMenu);
  });

  document.addEventListener("click", (event) => {
    if (
      !navLinks.contains(event.target) &&
      !menuToggle.contains(event.target)
    ) {
      closeMenu();
    }
  });
</script>

</body>

</html>
